<!-- =========================================
         PROFILE HEADER
    ========================================== -->

<div class="profile-header">

    <div class="profile-avatar">

        <img src="https://i.pravatar.cc/200?img=12" alt="Profile photo">

    </div>

</div>


<!-- =========================================
         PROFILE DETAILS
    ========================================== -->

<div class="profile-details">


    <!-- NAME -->

    <div class="profile-field">

        <span class="profile-label">
            Name
        </span>

        <span class="profile-value" id="profileName">
            John Doe
        </span>

    </div>


    <!-- USER ID -->

    <div class="profile-field">

        <span class="profile-label">
            UserId
        </span>

        <span class="profile-value" id="profileUserId">
            @johndoe
        </span>

    </div>


    <!-- PASSWORD -->

    <div class="profile-field">

        <span class="profile-label">
            Password
        </span>

        <span class="profile-value" id="profilePassword">
            ********
        </span>

    </div>


    <!-- ESCROW ADDRESS -->

    <div class="profile-field">

        <span class="profile-label">
            Escrow Address
        </span>

        <span class="profile-value" id="profileEscrowAddress">
            87fv4.....tb54
        </span>

    </div>


    <!-- EMAIL -->

    <div class="profile-field">

        <span class="profile-label">
            Email
        </span>

        <span class="profile-value" id="profileEmail">
            dawson.lobo@gmail.com
        </span>

    </div>


</div>


<!-- =========================================
         ACCOUNT ACTIONS
    ========================================== -->

<div class="profile-actions">

    <button type="button" class="edit-profile-btn" onclick="openEditProfile()">
        Edit Profile
    </button>


    <button type="button" class="export-data-btn" onclick="exportData()">
        Export Data
    </button>


    <button type="button" class="delete-account-btn" onclick="deleteAccount()">
        Delete Account
    </button>

</div>
